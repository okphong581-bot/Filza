name: 🍎 Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Flutter IPA
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      # ── 1. Checkout source ───────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      # ── 2. Setup Flutter ─────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      # ── 3. Scaffold fresh Flutter iOS project ────────────────
      # Tạo project chuẩn → có đủ ios/Podfile, Runner.xcodeproj...
      - name: Create fresh Flutter project
        run: |
          flutter create \
            --org com.ha.filza \
            --project-name ha_floating_demo \
            --platforms ios \
            $GITHUB_WORKSPACE/app

      # ── 4. Overlay source code từ repo ───────────────────────
      - name: Copy source files into project
        run: |
          # Xóa lib mặc định, thay bằng lib của mình
          rm -rf $GITHUB_WORKSPACE/app/lib
          cp -r $GITHUB_WORKSPACE/repo/lib $GITHUB_WORKSPACE/app/lib

          # Thay pubspec.yaml
          cp $GITHUB_WORKSPACE/repo/pubspec.yaml $GITHUB_WORKSPACE/app/pubspec.yaml

          # Thay Info.plist (quyền file, UIFileSharingEnabled...)
          cp $GITHUB_WORKSPACE/repo/ios/Runner/Info.plist \
             $GITHUB_WORKSPACE/app/ios/Runner/Info.plist

          echo "=== Cấu trúc project ==="
          ls -la $GITHUB_WORKSPACE/app/
          ls -la $GITHUB_WORKSPACE/app/ios/

      # ── 5. Flutter pub get ───────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get
        working-directory: $GITHUB_WORKSPACE/app

      # ── 6. Kiểm tra Podfile ──────────────────────────────────
      - name: Verify Podfile exists
        run: |
          ls -la $GITHUB_WORKSPACE/app/ios/
          cat $GITHUB_WORKSPACE/app/ios/Podfile

      # ── 7. Pod install ───────────────────────────────────────
      - name: Pod install
        run: pod install --repo-update
        working-directory: $GITHUB_WORKSPACE/app/ios

      # ── 8. Build iOS release (no codesign) ──────────────────
      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign
        working-directory: $GITHUB_WORKSPACE/app

      # ── 9. Package → IPA ────────────────────────────────────
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r $GITHUB_WORKSPACE/app/build/ios/iphoneos/Runner.app Payload/Runner.app

          # Xóa icon để giảm dung lượng (không cần logo app)
          rm -rf Payload/Runner.app/AppIcon*.png
          rm -rf Payload/Runner.app/Assets.car 2>/dev/null || true

          zip -r HaFloatingDemo.ipa Payload/
          echo "✅ IPA size: $(du -sh HaFloatingDemo.ipa | cut -f1)"
        working-directory: $GITHUB_WORKSPACE

      # ── 10. Upload artifact ───────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaFloatingDemo-IPA
          path: ${{ github.workspace }}/HaFloatingDemo.ipa
          retention-days: 30

      # ── 11. Create GitHub Release ─────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "📦 Ha File Manager — Build #${{ github.run_number }}"
          body: |
            ## Ha Floating Demo — File Manager iOS

            **Build:** #${{ github.run_number }}
            **Commit:** `${{ github.sha }}`
            **Date:** ${{ github.event.head_commit.timestamp }}

            ### Tính năng
            - 📂 Duyệt & nhập đường dẫn tùy chỉnh
            - ⬆️ Tiêm file vào bất kỳ thư mục nào
            - 📁 Tạo / Xóa / Đổi tên file & folder
            - 🔖 Quick Access: `/var/mobile/Documents`, `/tmp`...
            - 🔍 Tìm kiếm file trong thư mục

            ### Cài đặt IPA
            | Công cụ | Link |
            |---|---|
            | **AltStore** (miễn phí) | [altstore.io](https://altstore.io) |
            | **Sideloadly** | [sideloadly.io](https://sideloadly.io) |
            | **TrollStore** (jailbreak) | Cài trực tiếp |

            > ⚠️ IPA không codesign — cần AltStore / Sideloadly / TrollStore để cài.
          files: ${{ github.workspace }}/HaFloatingDemo.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
