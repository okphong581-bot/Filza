name: 🍎 Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_DIR: app
  FLUTTER_VERSION: '3.22.2'

jobs:
  build-ios:
    name: Build Flutter IPA
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      # ── 1. Checkout source ───────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      # ── 2. Setup Flutter ─────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # ── 3. Scaffold fresh Flutter iOS project ────────────────
      - name: Create fresh Flutter project
        run: |
          flutter create \
            --org com.ha.filza \
            --project-name ha_floating_demo \
            --platforms ios \
            ${{ github.workspace }}/${{ env.APP_DIR }}

      # ── 4. Overlay source code từ repo ───────────────────────
      - name: Copy source files into project
        run: |
          SRC=${{ github.workspace }}/repo
          DST=${{ github.workspace }}/${{ env.APP_DIR }}

          # Thay lib/
          rm -rf "$DST/lib"
          cp -r "$SRC/lib" "$DST/lib"

          # Thay pubspec.yaml
          cp "$SRC/pubspec.yaml" "$DST/pubspec.yaml"

          # Thay Info.plist
          cp "$SRC/ios/Runner/Info.plist" "$DST/ios/Runner/Info.plist"

          echo "=== lib/ ==="
          ls "$DST/lib/"
          echo "=== ios/ ==="
          ls "$DST/ios/"

      # ── 5. Flutter pub get ───────────────────────────────────
      - name: Flutter pub get
        working-directory: ${{ github.workspace }}/${{ env.APP_DIR }}
        run: flutter pub get

      # ── 6. Verify Podfile ────────────────────────────────────
      - name: Verify Podfile
        working-directory: ${{ github.workspace }}/${{ env.APP_DIR }}/ios
        run: |
          ls -la
          cat Podfile

      # ── 7. Pod install ───────────────────────────────────────
      - name: Pod install
        working-directory: ${{ github.workspace }}/${{ env.APP_DIR }}/ios
        run: pod install --repo-update

      # ── 8. Build iOS release (no codesign) ──────────────────
      - name: Build iOS
        working-directory: ${{ github.workspace }}/${{ env.APP_DIR }}
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # ── 9. Package → IPA ─────────────────────────────────────
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "${{ github.workspace }}/${{ env.APP_DIR }}/build/ios/iphoneos/Runner.app" Payload/Runner.app

          # Bỏ icon/logo để giảm dung lượng
          rm -f Payload/Runner.app/AppIcon*.png
          rm -f Payload/Runner.app/Assets.car 2>/dev/null || true

          zip -r HaFloatingDemo.ipa Payload/
          echo "✅ IPA size: $(du -sh HaFloatingDemo.ipa | cut -f1)"
        working-directory: ${{ github.workspace }}

      # ── 10. Upload artifact ──────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaFloatingDemo-IPA
          path: ${{ github.workspace }}/HaFloatingDemo.ipa
          retention-days: 30

      # ── 11. Create GitHub Release ─────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "📦 Ha File Manager — Build #${{ github.run_number }}"
          body: |
            ## Ha Floating Demo — File Manager iOS

            **Build:** #${{ github.run_number }}
            **Commit:** `${{ github.sha }}`

            ### Tính năng
            - 📂 Duyệt & nhập đường dẫn tùy chỉnh
            - ⬆️ Tiêm file vào bất kỳ thư mục nào
            - 📁 Tạo / Xóa / Đổi tên file & folder
            - 🔖 Quick Access: `/var/mobile/Documents`, `/tmp`...
            - 🔍 Tìm kiếm file trong thư mục

            ### Cài đặt IPA
            | Công cụ | Link |
            |---|---|
            | **AltStore** (miễn phí) | [altstore.io](https://altstore.io) |
            | **Sideloadly** | [sideloadly.io](https://sideloadly.io) |
            | **TrollStore** (jailbreak) | Cài trực tiếp |

            > ⚠️ IPA không codesign — cần AltStore / Sideloadly / TrollStore để cài.
          files: ${{ github.workspace }}/HaFloatingDemo.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
